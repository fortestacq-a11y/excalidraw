server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        # never cache the HTML entry point; hashed assets are fine
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Same-origin reverse proxy for user-configured AI providers.
    # Target base URL is passed in the X-AI-Target header; this avoids
    # CORS entirely since the browser only talks to this origin.
    location ~ ^/ai-proxy(?<ai_path>/.*)$ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        set $ai_target $http_x_ai_target$ai_path$is_args$args;
        proxy_pass $ai_target;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
